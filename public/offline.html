<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - ISU DB MAPS</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f5f5f5;
      text-align: center;
      padding: 0 20px;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
    }
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 16px;
    }
    p {
      color: #666;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <img src="/images/isu-logo.png" alt="ISU DB MAPS Logo" class="logo">
  <h1>Nu sunteți conectat la internet</h1>
  <p>Pentru a utiliza aplicația ISU DB MAPS, aveți nevoie de o conexiune la internet. Verificați conexiunea și încercați din nou.</p>
  <a href="/" class="button">Reîncercați</a>
</body>
</html>
