        function displayTerms(terms, listElement, highlightNumbers = false) {
    listElement.innerHTML = '';
    terms.forEach(term => {
        const li = document.createElement('li');
        const termWithoutNumber = term.replace(/\d+$/, '').trim();
        const numberMatch = term.match(/\d+$/);

        // Dacă termenul are număr, adăugăm caseta de checkbox
        if (numberMatch) {
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = term;
            li.appendChild(checkbox);
        }

        const termText = document.createTextNode(' ' + termWithoutNumber);
        li.appendChild(termText);

        // Dacă termenul are număr, adăugăm box-ul cu numărul
        if (highlightNumbers && numberMatch) {
            const numberBox = document.createElement('span');
            numberBox.className = 'number-box';
            numberBox.textContent = numberMatch[0];
            li.appendChild(numberBox);
        }

        // Dacă termenul nu are număr, schimbăm fundalul pe gri
        if (!numberMatch) {
            li.style.backgroundColor = '#d3d3d3';  // Gri
            li.style.fontWeight = 'bold'; //bold
        }

        listElement.appendChild(li);
    });
}


        function setupSearch(searchInputId, termsListId, terms, highlightNumbers = false) {
            const searchInput = document.getElementById(searchInputId);
            const termsList = document.getElementById(termsListId);

            displayTerms(terms, termsList, highlightNumbers);

            searchInput.addEventListener('input', function () {
                const query = this.value.toLowerCase();
                const filteredTerms = terms.filter(term => term.toLowerCase().includes(query));
                displayTerms(filteredTerms, termsList, highlightNumbers);
            });
        }
        setupSearch('searchInput0', 'termsList0', terms0, true);
        setupSearch('searchInput1', 'termsList1', terms1, true);
        setupSearch('searchInput2', 'termsList2', terms2, true);
        setupSearch('searchInput3', 'termsList3', terms3, true);
        setupSearch('searchInput4', 'termsList4', terms4, true);

        function setupToggle(sectionId, contentId) {
            const sectionHeader = document.getElementById(sectionId);
            const content = document.getElementById(contentId);
            const arrow = sectionHeader.querySelector('.arrow');

            sectionHeader.addEventListener('click', function () {
                content.classList.toggle('hidden');
                arrow.classList.toggle('rotate');
            });
        }

        setupToggle('togglelocul', 'loculContent');
        setupToggle('toggleSursa', 'sursaContent');
        setupToggle('toggleMijlocul', 'mijloculContent');
        setupToggle('toggleMaterial', 'materialContent');
        setupToggle('toggleImprejurare', 'imprejurareContent');

        document.getElementById('generateSource').addEventListener('click', function () {
            const selectedTerms = Array.from(document.querySelectorAll('ul input[type="checkbox"]:checked'))
                                        .map(checkbox => ({
                                            section: checkbox.closest('div').previousElementSibling.textContent.trim(),
                                            term: checkbox.value
                                        }));

            const selectedTermsDiv = document.getElementById('selectedTerms');
            if (selectedTerms.length) {
                selectedTermsDiv.innerHTML = '<strong>Elemente selectate:</strong><br>' + 
                selectedTerms.map(item => {
    const number = item.term.match(/\d+/);
    return `<div class="selected-item"> 
                <span class="section-title">${item.section}:</span> <br> 
                ${item.term.replace(number ? number[0] : '', '').trim()}
                ${number ? `<span class="number-box">${number[0]}</span>` : ''}
            </div>`;
}).join('');
         } else {
                selectedTermsDiv.innerHTML = 'Nu ai selectat niciun element.';
            }
        });
    </script>
<script>
    function setupSingleSelection(termsListId) {
        const termsList = document.getElementById(termsListId);
        
        termsList.addEventListener('change', function(event) {
            if (event.target.type === 'checkbox') {
                Array.from(termsList.querySelectorAll('input[type="checkbox"]')).forEach(checkbox => {
                    if (checkbox !== event.target) {
                        checkbox.checked = false;
                    }
                });
            }
        });
    }

    setupSingleSelection('termsList1');
    setupSingleSelection('termsList2');
    setupSingleSelection('termsList3');
    setupSingleSelection('termsList4');
    setupSingleSelection('termsList0');
    
   
    
</script>
